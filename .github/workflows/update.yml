name: Actualizar feeds

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Construir feeds.json
        run: python build_feeds.py

      - name: Publicar cambios
        run: |
          git config user.name "tfm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feeds.json yt_ids.json
          git diff --staged --quiet || git commit -m "feeds: actualización automática"
          git push
